<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift A/B">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lift A/B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0c0f; --surface:#16181d; --surface2:#20232a; --ink:#f4f6f9; --muted:#8b93a1; --line:#262a32;
  --accent:#3d8bfd; --accent-ink:#ffffff; --done:#22c55e; --done-bg:rgba(34,197,94,.14); --danger:#ef5350;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f3f6; --surface:#ffffff; --surface2:#eef0f4; --ink:#12151a; --muted:#667180; --line:#dde1e7;
    --accent:#1f6bff; --done:#16a34a; --done-bg:rgba(22,163,74,.12); --danger:#d93025; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f2f3f6; --surface:#ffffff; --surface2:#eef0f4; --ink:#12151a; --muted:#667180; --line:#dde1e7;
  --accent:#1f6bff; --done:#16a34a; --done-bg:rgba(22,163,74,.12); --danger:#d93025; color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Barlow",-apple-system,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 170px}
h1{font:700 40px/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:6px 0}
h2{font:700 21px/1.15 "Barlow Condensed","Arial Narrow",sans-serif;margin:0}
button,select,input{font-family:inherit}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sub,.mu{color:var(--muted);font-size:14px}.sub{margin:0 0 12px}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px}
.seg button{min-width:52px;min-height:40px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:700 20px "Barlow Condensed",sans-serif;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.prog{margin:4px 0 10px}
.bar{height:8px;border-radius:8px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--done);transition:width .25s}
.pt{display:flex;justify-content:space-between;margin-top:6px;font-size:14px;color:var(--muted)}
.rs{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);margin:0 0 10px}
.rs select{background:var(--surface);color:var(--ink);border:0;border-radius:10px;min-height:40px;padding:0 10px;font-size:15px}
.note{background:var(--surface);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--muted);margin-bottom:12px}
.ex{background:var(--surface);border-radius:16px;padding:14px 12px 10px;margin-bottom:12px}
.ex.complete{box-shadow:inset 0 0 0 1.5px var(--done)}
.exh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px;padding:0 2px}
.exh h2{color:var(--accent)}
.tg{font:600 15px "Barlow Condensed",sans-serif;color:var(--muted);white-space:nowrap}
.hint{font-size:13px;color:var(--muted);margin:0 2px 8px}
.hint.up{color:var(--done);font-weight:600}
.th,.sr{display:grid;grid-template-columns:26px 1fr 66px 60px 44px;gap:8px;align-items:center}
.th{font-size:12px;color:var(--muted);padding:0 6px;text-align:center}.th span:nth-child(2){text-align:left}
.sr{padding:3px 6px;margin:0 -6px;border-radius:12px}
.sr.done{background:var(--done-bg)}
.sn{font:700 18px "Barlow Condensed",sans-serif;text-align:center;color:var(--muted)}
.pv{background:none;border:0;color:var(--muted);font-size:14px;text-align:left;min-height:44px;padding:0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bwl{text-align:center;color:var(--muted);font-size:13px}
.in{width:100%;min-height:44px;border:0;border-radius:10px;background:var(--surface2);color:var(--ink);font:700 22px "Barlow Condensed",sans-serif;text-align:center;padding:0 4px}
.ck{width:44px;height:44px;border:0;border-radius:12px;background:var(--surface2);color:var(--muted);font-size:20px;cursor:pointer}
.ck[aria-pressed="true"]{background:var(--done);color:#fff}
.btn{min-height:52px;border-radius:14px;border:0;background:var(--surface2);color:var(--ink);font:600 16px "Barlow",sans-serif;cursor:pointer;padding:0 16px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;margin-top:6px;font-size:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btns .btn{flex:1 1 140px}
.lnk{display:block;margin:26px auto 0;background:none;border:0;color:var(--muted);font-size:14px;min-height:44px;cursor:pointer;text-decoration:underline}
.sm{min-height:40px;padding:0 12px;border:0;border-radius:10px;background:var(--surface2);color:var(--muted);font:600 14px "Barlow",sans-serif;cursor:pointer}
.card2{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:12px}
.card2 p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);flex:1;min-width:120px}
.form .in{font-size:20px}
.form input[type=date]{font:600 17px "Barlow",sans-serif}
.msg{min-height:20px;margin-top:8px;font-size:14px;color:var(--muted)}
.hx{background:var(--surface);border-radius:14px;padding:0 14px;margin-bottom:8px}
.hx summary{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:54px;cursor:pointer;font-weight:600}
.hx[open]{padding-bottom:8px}
.he{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.he b{font:700 18px "Barlow Condensed",sans-serif}
.ha{display:flex;gap:6px}
.empty{font-size:14px;color:var(--muted);padding:4px 0 10px}
.chart{display:block;width:100%;height:auto;margin:4px 0 8px}
.chart .gl{stroke:var(--line);stroke-width:1}.chart .ln{stroke:var(--accent);fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dt{fill:var(--accent)}.chart .ax{fill:var(--muted);font:11px "Barlow",sans-serif}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:4px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;border:0;background:none;color:var(--muted);font:600 11px "Barlow",sans-serif;cursor:pointer}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent)}
.rest{position:fixed;left:10px;right:10px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:19;max-width:540px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:8px 8px 8px 14px}
.rest.over{background:var(--done)}
.rest span{flex:1;font:700 22px "Barlow Condensed",sans-serif}
.rest button{min-height:40px;padding:0 12px;border:0;border-radius:10px;background:rgba(255,255,255,.22);color:inherit;font:600 14px "Barlow",sans-serif;cursor:pointer}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.sheet .card{width:100%;max-width:560px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85%;overflow-y:auto}
.sheet h2{font-size:28px;margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.stats div{background:var(--surface2);border-radius:12px;padding:8px 4px;text-align:center}
.stats b{display:block;font:700 24px "Barlow Condensed",sans-serif}.stats span{font-size:12px;color:var(--muted)}
.warn{color:var(--danger);font-size:14px;margin:6px 0}
.er{display:grid;grid-template-columns:26px 1fr auto 1fr auto;gap:8px;align-items:center;margin-top:8px}
.toast{position:fixed;left:10px;right:10px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:25;max-width:540px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:var(--bg);border-radius:14px;padding:6px 8px 6px 16px;font-weight:600}
.toast button{min-height:40px;border:0;background:none;color:var(--accent);font:700 16px "Barlow",sans-serif;cursor:pointer}
.nav button:focus-visible,.btn:focus-visible,.sm:focus-visible,.ck:focus-visible,.pv:focus-visible,.in:focus-visible,.seg button:focus-visible,.hx summary:focus-visible,.lnk:focus-visible,.rs select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap"><main id="view"></main></div>
<div class="rest" id="rest" hidden><span id="rtxt"></span><button data-r="-15">−15s</button><button data-r="15">+15s</button><button data-r="skip">Skip</button></div>
<div class="toast" id="toast" hidden></div>
<nav class="nav" id="nav" aria-label="Main">
  <button data-tab="work"><svg viewBox="0 0 24 24"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></svg>Workout</button>
  <button data-tab="hist"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>History</button>
  <button data-tab="body"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 10a4 4 0 0 1 8 0M12 10l2-2"/></svg>Body</button>
  <button data-tab="bk"><svg viewBox="0 0 24 24"><path d="M12 4v10M8 10l4 4 4-4M5 19h14"/></svg>Backup</button>
</nav>
<div class="sheet" id="sheet" hidden></div>
<script>
var PLAN = {
  A: [
    {n:"Squat (barbell, Smith or leg press)", s:3, r:"6–8"},
    {n:"DB bench or machine chest press", s:3, r:"6–10"},
    {n:"Seated cable row", s:3, r:"8–12"},
    {n:"Romanian deadlift", s:3, r:"8–10"},
    {n:"Lateral raise", s:3, r:"12–15"},
    {n:"Hanging leg raise", s:3, r:"10–15", bw:true}
  ],
  B: [
    {n:"Hip thrust or deadlift", s:3, r:"6–8"},
    {n:"Incline DB press", s:3, r:"8–12"},
    {n:"Lat pulldown or pull-up", s:3, r:"8–10"},
    {n:"Split squat or walking lunge", s:3, r:"10 per leg"},
    {n:"Face pull or rear delt raise", s:3, r:"12–15"},
    {n:"Biceps curl + triceps pushdown", s:2, r:"12 each"}
  ]
};
var NOTE = "Start with 5 min elliptical. Finish with 10 min incline walk. Hit the top of the rep range on every set, then add the smallest weight jump next time.";
var KEY = "liftab-v1", NAMES = [], BWN = {};
["A","B"].forEach(function(d){ PLAN[d].forEach(function(e){ if(NAMES.indexOf(e.n)<0) NAMES.push(e.n); if(e.bw) BWN[e.n] = 1; }); });
var state = defaults(), tab = "work", undoSnap = null, openN = -1, bodyDate = "", rest = {end:0, over:0}, pendingImport = null;
var $ = function(i){ return document.getElementById(i); };

function defaults(){ return {day:"A", cur:{}, sessions:{A:0,B:0}, last:"", body:[], hist:{}, restSec:90, started:0}; }
function norm(s){
  s = Object.assign(defaults(), s||{});
  s.cur = s.cur||{}; s.hist = s.hist||{}; s.body = s.body||[]; s.sessions = s.sessions||{A:0,B:0};
  Object.keys(s.hist).forEach(function(n){
    s.hist[n] = (s.hist[n]||[]).map(function(e){
      if(e.sets) return e;
      var a = []; for(var i=0;i<(e.s||1);i++) a.push({w:e.w, r:null});
      return {d:e.d, sets:a};
    });
  });
  return s;
}
function load(){ try{ var raw = localStorage.getItem(KEY); if(raw) state = norm(JSON.parse(raw)); }catch(e){} }
function save(){
  state.updated = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  queuePush();
}
function num(v){ var n = parseFloat(String(v==null ? "" : v).replace(",",".")); return isNaN(n) ? null : n; }
function cmp(a,b){ return a.d<b.d ? -1 : a.d>b.d ? 1 : 0; }
function hl(n){ return (state.hist[n]||[]).slice().sort(cmp); }
function topReps(r){ var m = String(r).match(/\d+/g); return m ? +m[m.length-1] : 0; }
function todayStr(){ var n = new Date(); return n.getFullYear()+"-"+("0"+(n.getMonth()+1)).slice(-2)+"-"+("0"+n.getDate()).slice(-2); }
function pd(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function fmtD(s){ return pd(s).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"}); }
function fmtS(s){ return pd(s).toLocaleDateString(undefined,{day:"numeric",month:"short"}); }
function mmss(ms){ var s = Math.max(0,Math.round(ms/1000)); return Math.floor(s/60)+":"+("0"+s%60).slice(-2); }
function fmtSet(p,bw){
  if(!p) return "–";
  var r = (p.r==null || p.r==="") ? "–" : p.r;
  return bw ? r+" reps" : (p.w==null ? "–" : p.w)+" × "+r;
}
function twice(t,txt){
  if(t.dataset.arm) return true;
  var o = t.textContent; t.dataset.arm = 1; t.textContent = txt;
  setTimeout(function(){ delete t.dataset.arm; t.textContent = o; }, 3000);
  return false;
}

/* ---------- workout ---------- */
function curSets(ex){
  var a = state.cur[ex.n];
  if(!a){
    var h = hl(ex.n), l = h[h.length-1]; a = [];
    for(var k=0;k<ex.s;k++){
      var p = l && (l.sets[k] || l.sets[l.sets.length-1]);
      a.push({w:(ex.bw || !p || p.w==null) ? "" : p.w, r:"", d:false});
    }
    state.cur[ex.n] = a;
  }
  return a;
}
function hint(ex){
  if(ex.bw) return "";
  var h = hl(ex.n); if(!h.length) return "";
  var l = h[h.length-1], top = topReps(ex.r), W = 0;
  l.sets.forEach(function(x){ if(x.w>W) W = x.w; });
  if(!W) return "";
  var ok = l.sets.length>=ex.s && l.sets.every(function(x){ return x.r!=null && x.r>=top; });
  return ok ? '<div class="hint up">Ready for more: every set hit '+top+' reps at '+W+' kg last time. Try '+(Math.round((W+2.5)*10)/10)+' kg today.</div>'
            : '<div class="hint">Goal: '+top+' reps on every set at '+W+' kg, then add weight.</div>';
}
function vWork(){
  var d = state.day, h = '<div class="head"><h1>Day '+d+'</h1><div class="seg"><button data-day="A" aria-pressed="'+(d==="A")+'">A</button><button data-day="B" aria-pressed="'+(d==="B")+'">B</button></div></div>';
  h += '<p class="sub">3 days a week, alternate A and B. Stop each set 1–2 reps short of failure.</p>';
  h += '<div class="prog"><div class="bar"><i id="pbar"></i></div><div class="pt"><span id="ptxt"></span><span id="ptime"></span></div></div>';
  h += '<label class="rs">Rest timer <select id="restSel">';
  [60,90,120,180].forEach(function(s){ h += '<option value="'+s+'"'+(state.restSec===s?' selected':'')+'>'+s+' sec</option>'; });
  h += '</select></label><div class="note">'+NOTE+'</div>';
  PLAN[d].forEach(function(ex,i){
    var a = curSets(ex), pv = hl(ex.n), l = pv[pv.length-1];
    h += '<section class="ex'+(a.every(function(x){return x.d;})?' complete':'')+'" data-i="'+i+'"><div class="exh"><h2>'+ex.n+'</h2><span class="tg">'+ex.s+' × '+ex.r+'</span></div>'+hint(ex);
    h += '<div class="th"><span>Set</span><span>Previous</span><span>'+(ex.bw?'':'kg')+'</span><span>Reps</span><span></span></div>';
    a.forEach(function(x,k){
      var p = l && l.sets[k];
      h += '<div class="sr'+(x.d?' done':'')+'" data-k="'+k+'"><span class="sn">'+(k+1)+'</span><button class="pv" data-pw="'+(p&&p.w!=null?p.w:"")+'" data-pr="'+(p&&p.r!=null?p.r:"")+'" aria-label="Copy previous set">'+fmtSet(p,ex.bw)+'</button>'
        + (ex.bw ? '<span class="bwl">BW</span>' : '<input class="in" data-f="w" inputmode="decimal" placeholder="0" value="'+x.w+'" aria-label="Set '+(k+1)+' weight in kg">')
        + '<input class="in" data-f="r" inputmode="numeric" placeholder="0" value="'+x.r+'" aria-label="Set '+(k+1)+' reps"><button class="ck" aria-pressed="'+x.d+'" aria-label="Mark set '+(k+1)+' done">✓</button></div>';
    });
    h += '</section>';
  });
  return h + '<button class="btn primary big" id="finish">Finish workout</button><button class="lnk" id="clear">Clear this workout</button>';
}
function updProg(){
  var t = 0, n = 0;
  PLAN[state.day].forEach(function(ex){ var a = curSets(ex); t += a.length; a.forEach(function(x){ if(x.d) n++; }); });
  if($("pbar")){ $("pbar").style.width = (t ? n/t*100 : 0)+"%"; $("ptxt").textContent = n+" of "+t+" sets done"; }
}
function stats(){
  var sets = 0, vol = 0, ex = 0, nw = 0, tot = 0;
  PLAN[state.day].forEach(function(e){
    var n = 0;
    curSets(e).forEach(function(x){
      tot++; if(!x.d) return; n++;
      var w = num(x.w), r = num(x.r);
      if(!e.bw && w==null) nw++;
      if(w && r) vol += w*r;
    });
    sets += n; if(n) ex++;
  });
  return {sets:sets, vol:Math.round(vol), ex:ex, nw:nw, tot:tot};
}
function sheet(h){ $("sheet").innerHTML = '<div class="card">'+h+'</div>'; $("sheet").hidden = false; }
function closeSheet(){ $("sheet").hidden = true; }
function toast(msg,undo){
  var t = $("toast"); t.innerHTML = '<span>'+msg+'</span>'+(undo ? '<button id="undo">Undo</button>' : ''); t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(function(){ t.hidden = true; }, 10000);
}
function finishSheet(){
  var s = stats(), h = '<h2>Finish Day '+state.day+'?</h2>';
  if(!s.sets){ sheet(h+'<p class="mu">No sets are ticked yet. Tick the sets you completed, then finish.</p><div class="btns"><button class="btn primary" id="shCancel">Keep going</button></div>'); return; }
  h += '<div class="stats"><div><b>'+s.sets+'</b><span>sets</span></div><div><b>'+s.ex+'</b><span>exercises</span></div><div><b>'+s.vol.toLocaleString()+'</b><span>kg lifted</span></div><div><b>'+(state.started?mmss(Date.now()-state.started):"–")+'</b><span>time</span></div></div>';
  if(s.nw) h += '<p class="warn">'+s.nw+' ticked '+(s.nw===1?'set has':'sets have')+' no weight entered and will be saved without one.</p>';
  if(s.tot>s.sets) h += '<p class="mu">'+(s.tot-s.sets)+' unticked '+(s.tot-s.sets===1?'set is':'sets are')+' not saved.</p>';
  sheet(h+'<div class="btns"><button class="btn primary" id="shSave">Save workout</button><button class="btn" id="shCancel">Keep going</button></div>');
}
function saveSession(){
  undoSnap = JSON.stringify(state);
  var td = todayStr(), d = state.day;
  PLAN[d].forEach(function(ex){
    var out = [];
    curSets(ex).forEach(function(x){ if(x.d) out.push({w:ex.bw ? null : num(x.w), r:num(x.r)}); });
    if(out.length){
      var arr = (state.hist[ex.n]||[]).filter(function(e){ return e.d!==td; });
      arr.push({d:td, sets:out}); state.hist[ex.n] = arr;
    }
    delete state.cur[ex.n];
  });
  state.sessions[d] = (state.sessions[d]||0)+1;
  state.last = "Day "+d+", "+new Date().toLocaleDateString();
  state.started = 0; state.day = d==="A" ? "B" : "A";
  rest.end = 0; $("rest").hidden = true;
  closeSheet(); save(); render(); window.scrollTo(0,0);
  toast("Workout saved","undo");
}

/* ---------- charts ---------- */
function chart(pts){
  if(pts.length<2) return '<div class="empty">Add one more entry to see a graph.</div>';
  var W = 320, H = 130, L = 38, R = 12, T = 12, B = 24, ys = pts.map(function(p){ return p.y; });
  var mn = Math.min.apply(null,ys), mx = Math.max.apply(null,ys);
  if(mx===mn){ mx += 1; mn -= 1; }
  var X = function(i){ return L+i*(W-L-R)/(pts.length-1); }, Y = function(v){ return H-B-(v-mn)/(mx-mn)*(H-T-B); };
  var ln = pts.map(function(p,i){ return X(i).toFixed(1)+","+Y(p.y).toFixed(1); }).join(" ");
  var s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Graph from '+ys[0]+' to '+ys[ys.length-1]+'">';
  s += '<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(mx)+'" y2="'+Y(mx)+'"/><line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(mn)+'" y2="'+Y(mn)+'"/>';
  s += '<text class="ax" x="'+(L-6)+'" y="'+(Y(mx)+4)+'" text-anchor="end">'+Math.round(mx*10)/10+'</text><text class="ax" x="'+(L-6)+'" y="'+(Y(mn)+4)+'" text-anchor="end">'+Math.round(mn*10)/10+'</text>';
  s += '<polyline class="ln" points="'+ln+'"/>';
  pts.forEach(function(p,i){ s += '<circle class="dt" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3.5"/>'; });
  s += '<text class="ax" x="'+L+'" y="'+(H-6)+'">'+fmtS(pts[0].d)+'</text><text class="ax" x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+fmtS(pts[pts.length-1].d)+'</text></svg>';
  return s;
}

/* ---------- history ---------- */
function vHist(){
  var h = '<div class="head"><h1>History</h1></div><p class="sub">Tap an exercise to see its graph and past sessions.</p>';
  NAMES.forEach(function(n,ni){
    var a = hl(n), bw = !!BWN[n], u = bw ? " reps" : " kg";
    var pts = a.map(function(e){ return {d:e.d, y:Math.max.apply(null, e.sets.map(function(s){ return (bw ? s.r : s.w)||0; }))}; });
    h += '<details class="hx"'+(openN===ni?' open':'')+'><summary><span>'+n+'</span><span class="mu">'+(pts.length ? pts[pts.length-1].y+u : "no entries")+'</span></summary>';
    if(!a.length) h += '<div class="empty">Nothing saved yet. Tick sets and tap Finish workout.</div>';
    else {
      h += chart(pts.slice(-20));
      for(var i=a.length-1;i>=0;i--){
        var e = a[i], df = "";
        if(i>0){ var q = Math.round((pts[i].y-pts[i-1].y)*10)/10; df = q===0 ? "no change" : (q>0 ? "+" : "−")+Math.abs(q)+u; }
        h += '<div class="he"><div><b>'+fmtD(e.d)+'</b>'+(df ? ' <span class="mu">'+df+'</span>' : '')+'<div class="mu">'+e.sets.map(function(s){ return fmtSet(s,bw); }).join(", ")+'</div></div><div class="ha"><button class="sm" data-act="hedit" data-n="'+ni+'" data-d="'+e.d+'">Edit</button><button class="sm" data-act="hdel" data-n="'+ni+'" data-d="'+e.d+'">Delete</button></div></div>';
      }
    }
    h += '</details>';
  });
  return h;
}
function editSheet(ni,d){
  var n = NAMES[ni], bw = !!BWN[n], e = hl(n).filter(function(x){ return x.d===d; })[0]; if(!e) return;
  var h = '<h2>Edit '+fmtS(d)+'</h2><p class="mu">'+n+'</p>';
  e.sets.forEach(function(s,k){
    h += '<div class="er"><span class="sn">'+(k+1)+'</span>'+(bw ? '<span></span><span></span>' : '<input class="in ew" inputmode="decimal" value="'+(s.w==null?"":s.w)+'" aria-label="kg"><span class="mu">kg</span>')+'<input class="in ee" inputmode="numeric" value="'+(s.r==null?"":s.r)+'" aria-label="reps"><span class="mu">reps</span></div>';
  });
  sheet(h+'<div class="btns"><button class="btn primary" id="shEdit" data-n="'+ni+'" data-d="'+d+'">Save changes</button><button class="btn" id="shCancel">Cancel</button></div>');
}

/* ---------- body ---------- */
function vBody(){
  var a = state.body.slice().sort(cmp), h = '<div class="head"><h1>Body weight</h1></div>';
  if(!bodyDate) bodyDate = todayStr();
  h += '<div class="card2"><p>Log your own weight on any day.</p><div class="form"><label>Date<input class="in" type="date" id="bwDate" value="'+bodyDate+'"></label><label>Weight (kg)<input class="in" type="number" inputmode="decimal" step="0.1" min="0" placeholder="0.0" id="bwWeight"></label><button class="btn primary" id="bwSave" style="flex:0 0 100%">Save weight</button></div><div class="msg" id="bwMsg" role="status"></div></div>';
  if(a.length){
    var l = a[a.length-1], df = a.length>1 ? Math.round((l.w-a[a.length-2].w)*10)/10 : null;
    h += '<div class="card2"><h2>'+l.w+' kg</h2><p>'+fmtD(l.d)+(df==null ? "" : ", "+(df===0 ? "no change" : (df>0 ? "+" : "−")+Math.abs(df)+" kg")+" since the previous entry")+'</p>'+chart(a.slice(-30).map(function(e){ return {d:e.d, y:e.w}; }))+'</div>';
    h += '<div class="card2">';
    for(var i=a.length-1;i>=0;i--) h += '<div class="he"><div><b>'+a[i].w+' kg</b><div class="mu">'+fmtD(a[i].d)+'</div></div><button class="sm" data-act="bdel" data-d="'+a[i].d+'">Delete</button></div>';
    h += '</div>';
  } else h += '<div class="empty">No entries yet. Enter your weight above and tap Save weight.</div>';
  return h;
}

/* ---------- backup + cloud ---------- */
function vBk(){
  return '<div class="head"><h1>Backup</h1></div><div class="card2"><p>Your data is saved in this phone’s browser. When this page is opened signed in to Claude, a private cloud copy is kept too. For extra safety, export a backup file to your Files app or iCloud Drive now and then.</p>'
    + '<div class="msg" id="cloudMsg" role="status">'+cloudText+'</div>'
    + '<div class="btns"><button class="btn primary" id="bkExport">Export backup file</button><button class="btn" id="bkImport">Import backup file</button><button class="btn primary" id="bkApply" hidden>Restore this backup</button></div>'
    + '<input type="file" id="bkFile" accept=".json,application/json" hidden><div class="msg" id="bkMsg" role="status"></div></div>'
    + '<p class="sub">Sessions logged: A '+state.sessions.A+', B '+state.sessions.B+(state.last ? ". Last session: "+state.last : "")+'.</p>';
}
var cloud = {doc:null, timer:null, busy:false}, cloudText = "Cloud backup: connecting…";
function setStatus(t){ cloudText = t; var el = $("cloudMsg"); if(el) el.textContent = t; }
function bkMsg(t){ var el = $("bkMsg"); if(el) el.textContent = t; }
function durableEmpty(s){ return !((s.sessions && (s.sessions.A||s.sessions.B)) || (s.body && s.body.length) || (s.hist && Object.keys(s.hist).length)); }
function queuePush(){ if(!cloud.doc) return; clearTimeout(cloud.timer); cloud.timer = setTimeout(pushNow, 1500); }
function pushNow(){
  if(!cloud.doc) return;
  if(cloud.busy){ queuePush(); return; }
  cloud.busy = true;
  cloud.doc.set({json:JSON.stringify(state), updated:state.updated||Date.now()}).then(function(){
    setStatus("Cloud backup saved at "+new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"})+".");
  }).catch(function(){ setStatus("Cloud backup failed. Your data is still saved on this phone."); }).then(function(){ cloud.busy = false; });
}
async function initCloud(){
  var fail = function(){ setStatus("Cloud backup unavailable here. Open this page signed in to Claude to turn it on."); };
  try{
    if(!window.claude || !window.claude.use){ fail(); return; }
    var db = await window.claude.use("db"), user = await window.claude.use("user");
    if(!db || !user){ fail(); return; }
    var id = await user.id(), ref = db.collection("data/users/"+id).doc("liftab"), snap = await ref.get();
    cloud.doc = ref;
    var c = snap.exists ? snap.data() : null;
    if(c && c.json && (durableEmpty(state) || c.updated > (state.updated||0))){
      var s = JSON.parse(c.json);
      if(s && typeof s==="object"){
        state = norm(s);
        try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
        render(); setStatus("Your data was restored from the cloud backup."); return;
      }
    }
    pushNow();
  }catch(e){ fail(); }
}
async function exportBackup(){
  var name = "lift-ab-backup-"+todayStr()+".json";
  var data = JSON.stringify({app:"lift-ab", version:2, exported:new Date().toISOString(), data:state}, null, 1);
  try{
    var dl = null;
    try{ dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }catch(e){}
    if(dl){ await dl.save({filename:name, data:data}); bkMsg("Backup file ready: "+name+"."); return; }
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], {type:"application/json"})); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    bkMsg("Backup file ready: "+name+". Check your Downloads or choose Save to Files.");
  }catch(e){ bkMsg(e && e.code==="declined" ? "Export cancelled." : "The backup file could not be saved. Please try again."); }
}
function readImport(file){
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var p = JSON.parse(fr.result);
      if(!p || p.app!=="lift-ab" || !p.data || typeof p.data!=="object") throw 0;
      pendingImport = p.data; $("bkApply").hidden = false;
      bkMsg("Backup found"+(p.exported ? " from "+new Date(p.exported).toLocaleDateString() : "")+". Tap Restore this backup to replace the data on this page with it.");
    }catch(e){ pendingImport = null; $("bkApply").hidden = true; bkMsg("That file is not a Lift A/B backup."); }
  };
  fr.readAsText(file);
}

/* ---------- rest timer + clock ---------- */
function startRest(){ rest.end = Date.now()+state.restSec*1000; rest.over = 0; tick(); }
function tick(){
  var pt = $("ptime"); if(pt) pt.textContent = state.started ? "Time "+mmss(Date.now()-state.started) : "";
  var r = $("rest"); if(!rest.end) return;
  var left = rest.end-Date.now();
  if(left>0){ r.hidden = false; r.classList.remove("over"); $("rtxt").textContent = "Rest "+mmss(left); }
  else if(!rest.over){ rest.over = Date.now(); r.classList.add("over"); $("rtxt").textContent = "Rest over, go"; try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){} }
  else if(Date.now()-rest.over>5000){ r.hidden = true; rest.end = 0; rest.over = 0; }
}

/* ---------- render + events ---------- */
function render(){
  $("view").innerHTML = tab==="work" ? vWork() : tab==="hist" ? vHist() : tab==="body" ? vBody() : vBk();
  Array.prototype.forEach.call(document.querySelectorAll("#nav button"), function(b){ b.setAttribute("aria-current", b.dataset.tab===tab ? "page" : "false"); });
  if(tab==="work") updProg();
  tick();
}
document.addEventListener("click", function(e){
  if(e.target.id==="sheet"){ closeSheet(); return; }
  var t = e.target.closest("button"); if(!t) return;
  if(t.dataset.tab){ tab = t.dataset.tab; render(); window.scrollTo(0,0); return; }
  if(t.dataset.day){ state.day = t.dataset.day; save(); render(); return; }
  if(t.dataset.r){
    if(t.dataset.r==="skip"){ rest.end = 0; $("rest").hidden = true; }
    else { rest.end = Math.max(Date.now(), rest.end)+(+t.dataset.r)*1000; rest.over = 0; tick(); }
    return;
  }
  var row = t.closest(".sr"), card = t.closest(".ex");
  if(row && card){
    var ex = PLAN[state.day][+card.dataset.i], k = +row.dataset.k, a = curSets(ex);
    if(t.classList.contains("ck")){
      a[k].d = !a[k].d;
      if(a[k].d){ if(!state.started) state.started = Date.now(); startRest(); }
      row.classList.toggle("done", a[k].d); t.setAttribute("aria-pressed", a[k].d);
      card.classList.toggle("complete", a.every(function(x){ return x.d; }));
      updProg(); save(); return;
    }
    if(t.classList.contains("pv")){
      if(!t.dataset.pw && !t.dataset.pr) return;
      var ins = row.querySelectorAll(".in");
      if(!ex.bw){ a[k].w = t.dataset.pw; ins[0].value = a[k].w; }
      a[k].r = t.dataset.pr; ins[ex.bw ? 0 : 1].value = a[k].r; save(); return;
    }
  }
  if(t.id==="finish"){ finishSheet(); return; }
  if(t.id==="shCancel"){ closeSheet(); return; }
  if(t.id==="shSave"){ saveSession(); return; }
  if(t.id==="undo"){
    if(undoSnap){ state = norm(JSON.parse(undoSnap)); undoSnap = null; save(); render(); }
    $("toast").hidden = true; return;
  }
  if(t.id==="clear"){
    if(!twice(t,"Tap again to clear")) return;
    PLAN[state.day].forEach(function(ex){ delete state.cur[ex.n]; });
    state.started = 0; save(); render(); return;
  }
  if(t.dataset.act==="hedit"){ openN = +t.dataset.n; editSheet(openN, t.dataset.d); return; }
  if(t.dataset.act==="hdel"){
    if(!twice(t,"Sure?")) return;
    var n = NAMES[+t.dataset.n]; openN = +t.dataset.n;
    state.hist[n] = (state.hist[n]||[]).filter(function(x){ return x.d!==t.dataset.d; }); save(); render(); return;
  }
  if(t.id==="shEdit"){
    var nm = NAMES[+t.dataset.n], ent = (state.hist[nm]||[]).filter(function(x){ return x.d===t.dataset.d; })[0];
    if(ent){
      var ws = document.querySelectorAll(".ew"), rs = document.querySelectorAll(".ee");
      ent.sets.forEach(function(s,k){ if(ws[k]) s.w = num(ws[k].value); s.r = num(rs[k].value); });
      save();
    }
    closeSheet(); render(); return;
  }
  if(t.id==="bwSave"){
    var wv = num($("bwWeight").value), dv = $("bwDate").value;
    if(!dv || !(wv>0)){ $("bwMsg").textContent = "Pick a date and enter a weight above 0 to save."; return; }
    state.body = state.body.filter(function(x){ return x.d!==dv; }); state.body.push({d:dv, w:Math.round(wv*10)/10});
    save(); render(); $("bwMsg").textContent = "Saved for "+fmtD(dv)+"."; return;
  }
  if(t.dataset.act==="bdel"){
    if(!twice(t,"Sure?")) return;
    state.body = state.body.filter(function(x){ return x.d!==t.dataset.d; }); save(); render(); return;
  }
  if(t.id==="bkExport"){ exportBackup(); return; }
  if(t.id==="bkImport"){ $("bkFile").click(); return; }
  if(t.id==="bkApply"){
    if(!pendingImport) return;
    state = norm(pendingImport); pendingImport = null; save(); render(); bkMsg("Backup restored."); return;
  }
});
document.addEventListener("input", function(e){
  var el = e.target;
  if(el.id==="bwDate"){ bodyDate = el.value; return; }
  if(!el.dataset.f) return;
  var row = el.closest(".sr"), card = el.closest(".ex"); if(!row || !card) return;
  curSets(PLAN[state.day][+card.dataset.i])[+row.dataset.k][el.dataset.f] = el.value; save();
});
document.addEventListener("change", function(e){
  if(e.target.id==="restSel"){ state.restSec = +e.target.value; save(); }
  if(e.target.id==="bkFile"){ if(e.target.files && e.target.files[0]) readImport(e.target.files[0]); e.target.value = ""; }
});
load(); render(); initCloud(); setInterval(tick, 1000);
</script>
</body>
</html>
